[package]
name = "mysend_transport"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
x509-parser = { version = "0.18.1", features = ["verify"] }

# Directory-handle based access prevents symlink races at the mapping boundary.
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Storage_FileSystem"] }
