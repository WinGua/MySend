name: build

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get

      - name: 运行单元测试（仅提示，不阻断构建）
        continue-on-error: true
        run: flutter test

      - name: 静态分析（仅提示，不阻断构建）
        continue-on-error: true
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E '[[:space:]]error •' analyze.txt | head -n 10 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done

      - name: 写入签名密钥（来自 Secrets）
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > keystore/mysend-release.keystore

      - name: 构建 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: 重命名 APK
        run: mv build/app/outputs/flutter-apk/app-release.apk MySend-Android.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mysend_android
          path: MySend-Android.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows
        run: flutter build windows --release

      - name: 打包 Windows 为 zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MySend-Windows-x64.zip

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v4
        with:
          name: mysend_windows
          path: MySend-Windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mysend_android

      - uses: actions/download-artifact@v4
        with:
          name: mysend_windows

      - name: 发布 GitHub Release
        run: |
          # 删除同名旧 Release（若存在），以支持重复发布同一版本号
          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            MySend-Android.apk \
            MySend-Windows-x64.zip \
            --title "MySend ${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}