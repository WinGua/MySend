name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    # 仅当影响应用产物的文件变更时才构建；文档、图片说明等不会触发。
    # 路径过滤不作用于 tag push，打标签发版不受影响。
    paths:
      - 'lib/**'
      - 'native/**'
      - 'tool/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/build.yml'
      - 'android/**'
      - 'windows/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 安装 Rust 工具链
        run: rustup toolchain install --profile minimal

      - name: 汇总第三方许可
        run: python tool/generate_notices.py

      - name: 安装依赖
        run: flutter pub get

      - name: 验证原生 TLS 和单元测试
        run: |
          cargo test --manifest-path native/transport/Cargo.toml --locked
          cargo build --manifest-path native/transport/Cargo.toml --locked --release
          flutter test --dart-define=MYSEND_NATIVE_LIBRARY=${{ github.workspace }}/native/transport/target/release/libmysend_transport.so

      - name: 安装 Android 原生编译目标
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" >/dev/null

      - name: 静态分析（仅提示，不阻断构建）
        continue-on-error: true
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E '[[:space:]]error •' analyze.txt | head -n 10 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done

      - name: 写入签名密钥（来自 Secrets）
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > keystore/mysend-release.keystore

      - name: 构建 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: 重命名 APK
        run: mv build/app/outputs/flutter-apk/app-release.apk MySend-Android.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mysend_android
          path: MySend-Android.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 安装 Rust 工具链
        run: rustup toolchain install --profile minimal

      - name: 验证原生文件安全
        run: cargo test --manifest-path native/transport/Cargo.toml --locked

      - name: 汇总第三方许可
        run: python tool/generate_notices.py

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows
        run: flutter build windows --release

      - name: 验证 Windows 文件安全和协议回归
        shell: pwsh
        run: |
          flutter test --dart-define=MYSEND_NATIVE_LIBRARY=${{ github.workspace }}/native/transport/target/release/mysend_transport.dll

      - name: 验证 Windows release 首帧和服务启动
        shell: pwsh
        run: ./tool/windows_startup_smoke.ps1 -Executable build/windows/x64/runner/Release/MySend.exe

      - name: 上传 Windows 启动验证记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows_startup_smoke
          path: startup-smoke/*
          if-no-files-found: ignore

      - name: 打包 Windows 为 zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MySend-Windows-x64.zip

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v4
        with:
          name: mysend_windows
          path: MySend-Windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mysend_android

      - uses: actions/download-artifact@v4
        with:
          name: mysend_windows

      - name: 发布 GitHub Release
        run: |
          # 删除同名旧 Release（若存在），以支持重复发布同一版本号
          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            MySend-Android.apk \
            MySend-Windows-x64.zip \
            --title "MySend ${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
