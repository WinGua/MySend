name: build

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      # 云端自动生成 android/ 脚手架（本机无需 Flutter/Android SDK）
      - name: 生成平台脚手架
        run: |
          flutter create --project-name music_sync --platforms=android .
          dart tool/patch_android_manifest.dart
          dart tool/patch_android_kotlin.dart
          cp -r assets/icons/android/mipmap-* android/app/src/main/res/
          flutter pub get

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: my_send_android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 生成平台脚手架
        run: |
          flutter create --project-name music_sync --platforms=windows .
          dart tool/patch_windows.dart
          Copy-Item -Force assets/icons/windows/app_icon.ico windows/runner/resources/app_icon.ico
          flutter pub get

      - name: 构建 Windows
        run: flutter build windows --release

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v4
        with:
          name: my_send_windows
          path: build/windows/x64/runner/Release