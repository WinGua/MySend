name: music_sync
description: 局域网文件同步工具（PC 发送端 → Android 接收端）
publish_to: 'none'
version: 2.0.0+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Windows 11 风格 UI / 磨砂玻璃
  fluent_ui: ^4.8.0
  window_manager: ^0.3.9
  flutter_acrylic: ^1.1.3

  # 目录选择、权限、路径、存储
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # 二维码（生成 / 扫描）
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # 后台保活（唤醒锁）
  wakelock_plus: ^1.2.8

  # 工具
  uuid: ^4.4.0
  url_launcher: ^6.2.5

dependency_overrides:
  # 以下插件的新版本要求 AGP>=8.12.1 / Gradle>=8.13 / Kotlin 2.2，超出本工程 Flutter 3.24 工具链；
  # 统一锁回兼容版本，避免 "unknown property 'flutter'" 构建失败（API 均兼容）。
  package_info_plus: ^8.0.0
  wakelock_plus: 1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true