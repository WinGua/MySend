plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.wingua.mysend"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.wingua.mysend"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile file('../../keystore/mysend-release.keystore')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'mysend'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

// TLS stays native while the existing Dart protocol and UI remain unchanged.
def nativeTransport = tasks.register("buildNativeTransport", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine "python3", "tool/build_native.py", "android"
}
tasks.named("preBuild").configure { dependsOn nativeTransport }

// Generate redistribution notices before Flutter assembles its asset bundle.
tasks.configureEach {
    if (name.startsWith("compileFlutterBuild")) { dependsOn nativeTransport }
}
